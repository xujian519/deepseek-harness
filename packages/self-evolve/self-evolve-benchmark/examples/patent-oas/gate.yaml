# patent-oas 回归门禁策略。
#
# 门槛是策略而不是测量:测量来自 run 记录(baselinePath),门槛决定「多大的变化算退步」。
# 两者分开,是因为「这次考了多少分」是事实,「多少分算不合格」是决定。
#
# goldDigest 把金标内容(每个 case 的 statement 与 rubric)钉住:改金标必须显式重录摘要
# (`pnpm run verify-patent-oas-gold -- --write`),否则门禁失败。金标的改动会改变分数的含义,
# 不能悄悄生效。
#
# 门槛的来源:
#   - node 是单个问题空间切面的保守下限,可随实测调高;
#   - case 与 aggregate 的 maxDrop 比 node 更紧(3 vs 5):case 分是该 case 各维度观测的
#     加权均值、聚合分是 4 个 case 的均值,它们的抽样噪声更小,容忍回退的理由也更少。
#     不设这一层时,单个 case 的掉分会被跨 case 的节点均值摊薄掉;
#   - 两条逐节点覆盖只加在 DAG 的前置脊柱上(区别特征认定、实际解决的技术问题):
#     它们失败会把下游全部拖偏,所以下限高于 node 门槛。其余节点用 node 门槛;
#   - 2026-10-24 重录前曾为 amendment-grounding(50)与 technical-teaching(60)单列下限:
#     前者的两轮用例前提与第 1 轮实际产出不一致,后者的 rubric 只给两个可辩护结论之一
#     满分。两处根因修复后分别测得 83.3 与 92.2,均回到统一 node 下限。
# `--run` 与 `--accept` 用的基线都在 `baselines` 里声明;门槛对每条基线都要可满足,
# 否则门禁自己永远红——那是配置错误,由门禁直接报出。

benchmarkId: patent-oas

goldDigest: "sha256:34e3e528668f78a1becb71753bc2348e1311b9f4d26d481af08b6b495739df26"

# 基线按被测面各一条:提示词调用(`prompt`)与工作流调用(`workflow`)测的不是同一能力面,
# 读数不能互比,所以 `--accept` 按记录自己的 `execution`/`workflowId` 找落点,找不到就拒绝。
# 一条基线由一次实测产生,再由门禁提升:
#   pnpm run gate:patent-oas -- --execution prompt                 # 采集(需要 key),写出 run 记录
#   pnpm run verify-patent-oas-gold -- --accept <run.json>
# 每个被测面只要求覆盖它自己能跑的 case:工作流面目前只有 `oa-answer` 声明了
# `patent_oa_response_v1`,其余 case 没有该工作流可跑,所以那条基线的记录不含它们。
baselines:
  - execution: prompt
    path: packages/self-evolve/evaluation/patent-oas-baseline.json
  - execution: workflow
    workflowId: patent_oa_response_v1
    path: packages/self-evolve/evaluation/patent-oas-workflow-baseline.json

# 逐被测面的评分范围:这一面不产出证据的节点不参评,而不是按 0 分记进 case。
# 2026-10-25 首次工作流实测(oa-answer,聚合 84.55)里 `prior-art-search` 与
# `deliverable-format` 都只有 45.0:两者只由第 5 维「检索策略与答复格式」喂分,而
# `patent_oa_response_v1` 的 12 个阶段没有任何检索阶段,交付物全文 0 次出现「检索」。
# 这是清单决定的证据缺失,不是模型波动,所以按不评处理:这两个节点同时退出 case 与聚合的加权。
# 清单补上检索阶段后删掉这一条,读数口径就回到与提示词面可比。
surfaces:
  - execution: workflow
    workflowId: patent_oa_response_v1
    notAssessedNodes: [prior-art-search, deliverable-format]

thresholds:
  node: { minScore: 70, maxDrop: 5 }
  case: { minScore: 70, maxDrop: 3 }
  aggregate: { minScore: 75, maxDrop: 3 }
  nodes:
    distinguishing-features: { minScore: 75 }
    technical-problem: { minScore: 75 }
