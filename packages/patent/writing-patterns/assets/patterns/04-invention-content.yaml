id: "wp-spec-invention-content"
name: "发明内容三要素——技术问题、技术方案、有益效果（内容要素，不是标题）"
category: "spec_drafting"
sub_category: "invention_content"
summary: "发明内容部分必须包含三项内容要素：所要解决的技术问题（基于现有技术的缺陷提炼）、技术方案（对应权利要求，但用自然语言描述）、有益效果（与技术方案对应，尽量有数据或客观依据支撑）。三项都是内容要素，通常以自然段落平铺书写；《专利法实施细则》第二十条要求说明书五部分各自写明标题，并未禁止在部分内使用小标题，但提交体例通常不额外加标题。"
context: "适用于所有专利说明书的发明内容部分。"
keywords: ["发明内容", "技术问题", "技术方案", "有益效果", "必要技术特征", "从属权利要求"]
source_ref: "专利法实施细则第20条第1款；审查指南第二部分第二章"
quality: 0.85
version: 1
steps:
  - order: 1
    name: "写明所要解决的技术问题"
    instruction: "直接从背景技术的缺陷提炼。每个缺陷对应一个技术子问题。注意：技术问题不等于‘成本高’‘效率低’——应该是技术层面的具体问题。通常以自然段落书写，不必为它加小标题。"
    example: "本实用新型要解决的技术问题是：现有保护罩缺乏透气设计，在盐碱地高温+强光照环境下易导致幼苗烧苗。"
  - order: 2
    name: "写明技术方案"
    instruction: "与权利要求对应但用自然语言描述。至少写明独立权利要求的全部必要技术特征；对从属权利要求的附加技术特征，可以进一步给出包含附加特征的改进方案（审查指南第二部分第二章关于发明内容的要求允许‘还可以给出’），不必省略。通常以自然段落书写，不必为它加小标题。"
    example: "为实现上述目的，本实用新型提供如下技术方案：一种盐碱地苜蓿幼苗保护罩，包括罩体和底座；所述罩体顶部设有透气调节装置……"
  - order: 3
    name: "写明有益效果"
    instruction: "与技术方案对应。每个效果都要能回溯到具体的结构/方法特征。最好有对比数据或定量分析。通常以自然段落书写，不必为它加小标题。"
    example: "与现有技术相比，本发明的有益效果是：通过设置透气调节装置，可使罩内温度较环境温度降低5-8℃，有效防止高温烧苗……"
dos:
  - rule: "技术问题必须是技术层面的，而非商业/管理层面的"
  - rule: "有益效果与技术方案对应，不编造不存在的好处"
  - rule: "发明内容至少覆盖独立权利要求的全部必要技术特征，并可给出从属权利要求的附加技术特征"
  - rule: "三项内容要素通常以自然段落平铺，靠段落顺序区分；部分内小标题不是法定要求，按提交体例处理"
donts:
  - rule: "技术方案不写入与发明目的无关的非必要特征"
  - rule: "不要用「要解决的技术问题」「技术方案」「有益效果」等小标题替代说明书五部分标题"
