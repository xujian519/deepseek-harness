# 《专利审查指南》节级索引 — 随包资产，内容尚未核定。
#
# 指南的划分是"部分—章—节"，不是条号，所以按归一化路径登记（例如
# 第五部分第七章第 2.1 节 记为 第五部分第七章2.1）。路径由 reference.ts 归一化，
# 索引键必须与归一化结果完全一致。
#
# 路径已按《专利审查指南》2023 年修订版的实际节次核对一次（对照的是本机抽取的全文，
# 该来源未随包，重做这次核对需要自备 2023 年修订版文本），
# 订正三处编号：第一部分第一章第 2 节没有子节，原登记的 2.3 不存在（已删除）；
# 第二部分第二章的「技术领域」是 2.2.2 而不是 2.2.1；第二部分第九章第 2 节写作「2」，
# 不写作「2.0」。另按各节自己的内容重写了五行主题词（第二部分第二章2.3、第二部分第三章2.1、
# 第二部分第八章4.1、第四部分第三章4.4、第五部分第七章2.1）——它们原先挂的是别节或章名的标签。
#
# 来源：本仓库既有引用（patent-deadline 的送达与期限规则、patent-core 的正文规则注释、
# patent-rule 的 legalBasis、generate_patent_figure 的制图用词警告），未对指南原文核定。
# 主题词仍是这些引用的归纳，只有转录后的节文本才能核对它们是否属于该节。
#
# 每条 text / sourceDoc / verifiedOn 均为 null，因此每条指南引用的判定都是
# "未转录（未核验）"。
