name: CI (fork free)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  node-checks:
    if: github.repository == 'xujian519/deepseek-harness'
    runs-on: ubuntu-latest
    name: node 24 / lint + typecheck + test + docs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Duplication
        run: pnpm run duplication

      - name: Unit tests
        run: pnpm run test

      - name: Documentation checks
        run: pnpm run test:docs

  python-checks:
    if: github.repository == 'xujian519/deepseek-harness'
    runs-on: ubuntu-latest
    name: python 3.10 / keyless SDK
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Run keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest
