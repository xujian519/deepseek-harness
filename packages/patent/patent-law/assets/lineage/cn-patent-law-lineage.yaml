  - articleId: 10
    title: "专利申请权转让"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          专利申请权和专利权可以转让。
          中国单位或者个人向外国人转让专利申请权或者专利权的，必须经国务院有关主管部门批准。
          转让专利申请权或者专利权的，当事人应当订立书面合同，并向国务院专利行政部门登记，由国务院专利行政部门予以公告。专利申请权或者专利权的转让自登记之日起生效。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 11
    title: "专利权效力"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          发明和实用新型专利权被授予后，除本法另有规定的以外，任何单位或者个人未经专利权人许可，都不得实施其专利，即不得为生产经营目的制造、使用、许诺销售、销售、进口其专利产品，或者使用其专利方法以及使用、许诺销售、销售、进口依照该专利方法直接获得的产品。
          外观设计专利权被授予后，任何单位或者个人未经专利权人许可，都不得实施其专利，即不得为生产经营目的制造、销售、进口其外观设计专利产品。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 13
    title: "临时保护"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
