  - articleId: 6
    title: "职务发明创造"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          执行本单位的任务或者主要是利用本单位的物质技术条件所完成的发明创造为职务发明创造。职务发明创造申请专利的权利属于该单位；申请被批准后，该单位为专利权人。
          非职务发明创造，申请专利的权利属于发明人或者设计人；申请被批准后，该发明人或者设计人为专利权人。
          利用本单位的物质技术条件所完成的发明创造，单位与发明人或者设计人订有合同，对申请专利的权利和专利权的归属作出约定的，从其约定。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 9
    title: "先申请原则"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
