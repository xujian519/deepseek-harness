- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: enabled
          reasoningEffort: low
          # The snapshot server emits SSE keep-alive comments every 60 ms. On a
          # loaded 4-core runner a parallel test can stall the event loop past
          # a 150 ms idle window, aborting the stream and triggering an
          # llm-retry (two requests), which this scenario pins to one. 600 ms
          # keeps the keep-alive contract meaningful while tolerating load.
          streamIdleTimeoutMs: 600
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
