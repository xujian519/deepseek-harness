# The studio is the browser half: the Video conversation view (discovered
# projects, shots, renders, pending tasks, the CNY ledger) and its clip and
# keyframe preview. It ships switched off with the rest of the bundle; a profile
# that never enables the bundle keeps the chat tab default.
- insert:
