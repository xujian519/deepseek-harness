      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          国务院专利行政部门设立专利复审委员会。专利申请人对国务院专利行政部门驳回申请的决定不服的，可以自收到通知之日起三个月内，向专利复审委员会请求复审。专利复审委员会复审后，作出决定，并通知专利申请人。
          专利申请人对专利复审委员会的复审决定不服的，可以自收到通知之日起三个月内向人民法院起诉。
        changed: true
