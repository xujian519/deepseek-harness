id: "wp-oa-clarity-support"
name: "不清楚/不支持 OA 答复——区分 26.3 与 26.4"
category: "oa_clarity"
summary: "答复前先分清缺陷类型：26.3 是说明书公开不充分（本领域技术人员无法实现），26.4 是权利要求不清楚或得不到说明书支持，二者不能混用。不清楚看类型、用语和引用关系；支持看要求保护的技术方案能否从充分公开的内容中得到或概括得出且不超出公开范围。"
context: "适用于答复审查意见中关于专利法第26条第3款（充分公开）或第26条第4款（清楚、支持）的驳回理由。"
keywords: ["不清楚", "不支持", "功能性限定", "说明书支持", "26.3", "26.4", "充分公开", "概括"]
source_ref: "专利法第26条第3款；专利法第26条第4款；审查指南第二部分第二章第2.1节；审查指南第二部分第二章第3.2.1节；审查指南第二部分第二章第3.2.2节"
quality: 0.85
version: 1
steps:
  - order: 1
    name: "区分缺陷类型与法条"
    instruction: "先确认审查员援引的是哪一款。26.3 针对说明书：公开是否清楚、完整到本领域技术人员能够实现；26.4 针对权利要求书：是否清楚、简要，是否以说明书为依据。若审查员以 26.3 提出但实质争点是权利要求的概括范围，应在答复中厘清法条，避免按错误标准作答。"
    example: "审查员援引专利法第26条第4款，认为’伴热装置’的表述不清楚。经核对，说明书对伴热结构、介质和温度均有记载，本领域技术人员能够实现，故争点不在26.3的充分公开，而在于该功能性限定在权利要求中的边界是否清楚。"
  - order: 2
    name: "答复不清楚"
    instruction: "按 26.4 逐项检查：（1）主题名称是否清楚表明产品还是方法，且与技术内容相适应；（2）是否使用含义不确定的用语（厚、薄、强、弱、高温、高压等），除非该领域有公认确切含义；（3）是否出现“例如”“最好是”“尤其是”“必要时”等会限定出不同保护范围的用语；（4）是否使用“约”“接近”“等”“或类似物”等导致范围不清的用语；（5）多项从属权利要求的引用基础是否清楚。能通过修改消除的，优先修改而不是空泛争辩。"
    example: "权利要求1中的“必要时加热”使保护范围出现两种情形，导致不清楚。将其修改为“在温度低于X℃时加热”，既消除不确定用语，又未超出原说明书公开的范围。"
  - order: 3
    name: "答复得不到说明书支持"
    instruction: "支持的标准不是’本领域技术人员能否确定范围’，而是：权利要求所要求保护的技术方案，能否由本领域技术人员从说明书充分公开的内容中得到或概括得出，且不超出说明书公开的范围。重点核查：说明书是否给出足够的具体实施方式；上位概括是否涵盖无法合理预测的下位方式；并列概括中是否有下位方式不能解决该技术问题或达不到相同技术效果；本领域技术人员是否有充分理由怀疑概括范围内不能实施。说明书其他部分也计入支持判断，不限于具体实施方式。"
    example: "权利要求将“螺旋形加热介质通道”概括为“任意形状的加热通道”，但说明书仅记载螺旋形一种实施方式，且直管、蛇形管等替代方式能否达到相同的温度均匀效果无法合理预测，故该上位概括得不到说明书支持；可将权利要求限缩回螺旋形通道。"
  - order: 4
    name: "功能性限定的边界"
    instruction: "功能性限定应理解为覆盖所有能够实现该功能的实施方式，因此其支持问题取决于说明书是否公开了足够的方式。对产品权利要求，通常应尽量避免使用功能或效果特征；只有在技术特征无法用结构特征限定，或结构限定不如功能/效果限定恰当，且该功能或效果能通过说明书规定的实验、操作或本领域惯用手段直接、肯定地验证时，才可能允许。纯功能性的权利要求得不到说明书支持。"
    example: "“用于提高热交换效率的装置”属于纯功能性表述，说明书未给出除螺旋形通道外的其他实现方式，本领域技术人员无法预见其覆盖的全部范围，故得不到支持。可改为“包括螺旋形加热介质通道的伴热夹套”。"
dos:
  - rule: "先认定法条和缺陷类型，再决定是修改权利要求还是论证——26.3 与 26.4 的答复路径不同"
  - rule: "支持问题要落到说明书的具体实施方式、概括层次和可预测性，明确指出具体段落和附图标记"
  - rule: "能通过限缩或替换用语消除不清楚的，优先修改；修改不得超出原说明书和权利要求书记载的范围"
donts:
  - rule: "不要把“本领域技术人员能确定范围”当作支持的标准——支持要求方案能从充分公开的内容中得到或概括得出"
  - rule: "不要用“这是本领域惯用手段”替代说明书中的支持"
  - rule: "产品权利要求不要默认使用功能或效果特征；纯功能性权利要求不能获得支持"
  - rule: "不要把 26.3 的充分公开缺陷当作 26.4 的支持缺陷来答，反之亦然"
