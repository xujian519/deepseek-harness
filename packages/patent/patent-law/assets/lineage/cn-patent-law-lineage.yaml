        text: "申请人要求优先权的，应当在申请的时候提出书面声明，并且在三个月内提交第一次提出的专利申请文件的副本；未提出书面声明或者逾期未提交专利申请文件副本的，视为未要求优先权。"
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
