id: "wp-ipc-strategy"
name: "IPC 分类辅助撰写——检索与审查领域定位"
category: "ipc_strategy"
summary: "IPC分类号用于检索现有技术、确定审查部门并公布专利文献，不是撰写规则。撰写应以权利要求的技术方案和审查指南的通用要求为准；IPC分类可作为检索和预判审查领域的辅助信息，但不能据此推定某一IPC段有特有审查标准。"
context: "适用于已完成IPC分类、希望利用分类信息辅助检索和撰写阶段。"
keywords: ["IPC", "分类号", "主分类号", "副分类号", "检索", "审查部门"]
source_ref: "审查指南第一部分第四章"
quality: 0.82
version: 1
steps:
  - order: 1
    name: "确定主分类号"
    instruction: "根据发明的核心改进点确定主分类号；例如储罐呼吸阀可能归入 B65D（容器）相关分类位置，具体以分类员结论为准。主分类号影响检索范围和审查部门分配，但不改变权利要求的撰写标准。"
  - order: 2
    name: "用IPC辅助检索与理解现有技术"
    instruction: "根据主分类号在相应分类位置检索现有技术，理解该领域常用的技术手段和术语；不要从IPC分类号推导出‘该段有特有审查规则’。审查标准来自专利法、细则和审查指南，不因IPC段而异。"
    example: "主分类号提示检索应覆盖该分类位置及其相关领域；撰写时仍按权利要求清楚、支持、必要技术特征等通用要求审查，不能因为分类号而降低或改变标准。"
  - order: 3
    name: "将IPC检索结果转化为撰写约束"
    instruction: "把检索到的现有技术用于背景技术、最接近现有技术和区别特征的撰写；IPC分类本身不产生额外的撰写约束。"
dos:
  - rule: "主分类号用于确定检索重点，副分类号用于补充检索；两者都不改变撰写标准"
  - rule: "说明书中客观描述与分类位置相关的技术效果，但以技术方案实际产生的效果为准，不编造分类‘要求’的效果"
donts:
  - rule: "不要根据IPC分类号推定审查标准或编造‘该段特有规则’；分类号不是法律依据"
