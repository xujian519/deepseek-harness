# 中国法定假日与调休上班日（专利期限届满日顺延用）。
#
# 依据：专利法实施细则第五条——期限届满日是法定休假日的，以休假日后的第一个
# 工作日为期限届满日；审查指南第五部分第七章第2.3节把"移用周休息日"一并纳入。
# 因此本文件同时记录两类日期：放假（非工作日）与调休上班（原本是周休息日但上班）。
#
# 数据来源（逐年引自政府公开通知，请勿手改数值，新增年份须附文号）：
#   2025 — 国务院办公厅关于2025年部分节假日安排的通知（国办发明电〔2024〕12号）
#   2026 — 国务院办公厅关于2026年部分节假日安排的通知（国办发明电〔2025〕7号）
#
# 覆盖年份之外一律 fail-loud（不静默按"非休假日"处理）：没有该年份的官方安排，
# 就无法判断届满日是否需要顺延。新增年份时在本文件追加一项，或经 Config.calendarDir
# 指向一份完整镜像本文件布局的自备日历。
years:
  - year: 2025
    source: 国务院办公厅关于2025年部分节假日安排的通知（国办发明电〔2024〕12号）
    holidays:
      # 元旦（1月1日，周三，不调休）
      - 2025-01-01
      # 春节（1月28日至2月4日，共8天）
      - 2025-01-28
      - 2025-01-29
      - 2025-01-30
      - 2025-01-31
      - 2025-02-01
      - 2025-02-02
      - 2025-02-03
      - 2025-02-04
      # 清明节（4月4日至6日，共3天）
      - 2025-04-04
      - 2025-04-05
      - 2025-04-06
      # 劳动节（5月1日至5日，共5天）
      - 2025-05-01
      - 2025-05-02
      - 2025-05-03
      - 2025-05-04
      - 2025-05-05
      # 端午节（5月31日至6月2日，共3天）
      - 2025-05-31
      - 2025-06-01
      - 2025-06-02
      # 国庆节、中秋节（10月1日至8日，共8天）
      - 2025-10-01
      - 2025-10-02
      - 2025-10-03
      - 2025-10-04
      - 2025-10-05
      - 2025-10-06
      - 2025-10-07
      - 2025-10-08
    workdays:
      # 春节调休
      - 2025-01-26
      - 2025-02-08
      # 劳动节调休
      - 2025-04-27
      # 国庆节、中秋节调休
      - 2025-09-28
      - 2025-10-11
  - year: 2026
    source: 国务院办公厅关于2026年部分节假日安排的通知（国办发明电〔2025〕7号）
    holidays:
      # 元旦（1月1日至3日，共3天）
      - 2026-01-01
      - 2026-01-02
      - 2026-01-03
      # 春节（2月15日至23日，共9天）
      - 2026-02-15
      - 2026-02-16
      - 2026-02-17
      - 2026-02-18
      - 2026-02-19
      - 2026-02-20
      - 2026-02-21
      - 2026-02-22
      - 2026-02-23
      # 清明节（4月4日至6日，共3天）
      - 2026-04-04
      - 2026-04-05
      - 2026-04-06
      # 劳动节（5月1日至5日，共5天）
      - 2026-05-01
      - 2026-05-02
      - 2026-05-03
      - 2026-05-04
      - 2026-05-05
      # 端午节（6月19日至21日，共3天）
      - 2026-06-19
      - 2026-06-20
      - 2026-06-21
      # 中秋节（9月25日至27日，共3天）
      - 2026-09-25
      - 2026-09-26
      - 2026-09-27
      # 国庆节（10月1日至7日，共7天）
      - 2026-10-01
      - 2026-10-02
      - 2026-10-03
      - 2026-10-04
      - 2026-10-05
      - 2026-10-06
      - 2026-10-07
    workdays:
