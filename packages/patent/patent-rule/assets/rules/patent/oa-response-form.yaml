# 审查意见答复的文书形式规则（手写资产，非生成物镜像）
#
# 来源：2026-09-30 案件评审（26.3 答复自检事故，会话 dsh-session-d5c70bfc）。该答复
# 通过了全部既有规则（既有规则管「不该出现什么」），却出现两类无规则可查的缺陷：
#   1. 以字词计数代替实体论证（「『供漆』『储漆』各出现 0 次」「『涂漆刷』共出现 15 处」）——
#      26.3 的法定判准是「所属技术领域的技术人员能否实现」，不是词频统计；
#   2. 同一段说明书原文被反复整段复述，篇幅增长而论证不增。
# 两类都可用确定性规则判定，故落为本文件：只作用于 rule_check 显式自检（答复作业
# scope），不进输出门禁（门禁只取 keyword_blocklist，见 selectGateRules）。
# 未核验的条号按语义命名，不写未核验条号。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 禁止计数式论证：以词频/条数统计支撑结论，替代实体法论证
  # ---------------------------------------------------------------------------
  pr_oa_count_argument:
    id: PR-OA-005
    name: 答复—禁止计数式论证
    domain: patent_oa_response
    phase: 输出
    severity: major
    action: warn
    legalBasis: 专利法第二十六条第三款：说明书充分公开以所属技术领域的技术人员能够实现为准；字词出现次数不是法定判准
    description: 命中词频/条数统计式表述；计数可用于检索留痕，不能作为"公开是否充分"的论证依据——应按 26.3 判准改以"本领域技术人员能否实现"陈述
    check:
      type: pattern_analysis
      patterns:
        - "出现\\s*0\\s*次"
        - "(?:共|各|合计|总计)\\s*出现\\s*[0-9]+\\s*(?:处|次)"
        - "[0-9]+\\s*处(?:记载|提到|出现)"
        - "全文(?:共|仅|只)\\s*(?:出现|记载)\\s*[0-9]+"

  # ---------------------------------------------------------------------------
  # 重复引证：同一引文整段重复出现
  # ---------------------------------------------------------------------------
  pr_oa_quote_repetition:
    id: PR-OA-006
    name: 答复—重复引证
    domain: patent_oa_response
    phase: 输出
    severity: minor
    action: warn
    legalBasis: 答复撰写规范：同一引文以一处完整引用为限，其后以引文位置指代（"见前述引文"），不复述原文
    description: 同一引述片段重复出现；重复引证不增加论证，只增加篇幅，并让逐点答复的线索被打散
    check:
      type: quote_repetition
      minLength: 12
      minOccurrences: 2

  # ---------------------------------------------------------------------------
  # 26.3 答复的判准落位：答复必须用法定判准组织（本领域技术人员 + 能否实现 + 说明书内容）
  # 前提：只在该答复确实围绕 26.3 时评估（判准落位是对 26.3 答复的形式要求）
  # ---------------------------------------------------------------------------
  pr_oa_enablement_standard:
    id: PR-OA-007
    name: 答复—26.3 判准落位
    domain: patent_oa_response
    phase: 输出
    severity: major
    action: warn
    legalBasis: 专利法第二十六条第三款；《专利审查指南》第二部分第二章第 2.1.3 节：以所属技术领域的技术人员能够实现为准，判断依据为说明书记载的内容
    description: 26.3 答复须落到法定判准（本领域技术人员 / 能否实现 / 说明书记载的内容）；只陈述"说明书未记载某特征"而未回到判准，等于把技术方案要件审查混入充分公开审查
    premise:
      - "第二十六条\\s*第三款"
      - "26\\s*[.．]\\s*3"
      - "充分公开"
      - "公开不充分"
    check:
      type: structural_analysis
      minConfidence: 0.66
      requiresAll:
        - element: enablement_standard
          description: 以"能否实现"为判准的落位表述
          patterns:
            - "能够实现"
            - "能够实施"
            - "不能实现"
            - "无法实现"
            - "无法实施"
        - element: skilled_person
          description: 判准主体（所属技术领域的技术人员）
          patterns:
            - "所属技术领域的技术人员"
            - "本领域技术人员"
            - "本领域的技术人员"
        - element: spec_basis
          description: 判准依据（以说明书记载的内容为据）
          patterns:
            - "说明书记载"
            - "说明书公开"
            - "说明书的内容"
            - "根据说明书"
            - "按照说明书"
            - "依据说明书"
