id: "wp-disclosure-pfe"
name: "技术交底书撰写——PFE 三元组提取法"
category: "disclosure"
summary: "技术交底书的核心是PFE三元组：Problem（技术问题）、Feature（技术特征）、Effect（技术效果）。从发明人的原始描述中准确提取这三个要素，是撰写高质量交底书的第一步。九段式结构是可选的内部工作模板，不是法定结构；转成说明书时须落到专利法实施细则第20条规定的五个部分。"
context: "适用于专利代理人/发明人撰写技术交底书。"
keywords: ["技术交底书", "PFE", "技术问题", "技术特征", "技术效果", "交底"]
source_ref: "专利法实施细则第20条；专利法第22条第4款"
quality: 0.88
version: 1
steps:
  - order: 1
    name: "提取技术问题（Problem）"
    instruction: "从发明人的描述中析出现有技术存在的具体技术问题。问三个问题：现有方案是什么？它有什么不足？这个不足导致的直接后果是什么？"
  - order: 2
    name: "提取技术特征（Feature）"
    instruction: "将发明人提供的技术方案分解为特征清单。区分必要特征和附加特征。必要特征是解决技术问题不可或缺的，附加特征是可选的优化。"
  - order: 3
    name: "提取技术效果（Effect）"
    instruction: "梳理技术特征与技术效果的对应关系，但不要机械地一一对应：一个特征可能产生多项效果，一项效果也可能由多个特征共同产生。效果要有可验证性（测试数据、对比实验），而非主观评价。"
  - order: 4
    name: "组织结构并映射到法定部分"
    instruction: "交底书正文可按九段式工作模板组织：发明名称→技术领域→背景技术→发明内容（问题/方案/效果）→附图说明→具体实施方式→工业实用性→与最接近现有技术的区别→其他说明。该模板仅用于内部梳理，不是法定结构。转成说明书时，按专利法实施细则第20条落到五个部分：技术领域、背景技术、发明内容、附图说明、具体实施方式。其中工业实用性是专利法第22条第4款的授权条件，与最接近现有技术的区别属于创造性分析，二者都不是说明书的法定部分，应分别并入背景技术、发明内容或具体实施方式中说明。"
dos:
  - rule: "PFE 是分析工具，用于核对问题、特征、效果是否自洽，不苛求字面意义上的逐项一一对应"
  - rule: "交底书包含至少一个完整的具体实施方式，含具体参数"
  - rule: "转写说明书时以实施细则第20条的五个部分为准，九段式仅作素材组织"
donts:
  - rule: "技术问题不能泛化为’成本高’’效率低’——必须是技术层面的具体问题"
  - rule: "效果不能是’效果好’’结构简单’——要有具体数据或客观标准"
  - rule: "不要把工业实用性、与最接近现有技术的区别当作说明书的法定章节"
