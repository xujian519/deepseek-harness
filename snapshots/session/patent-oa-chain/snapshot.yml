version: 1
scenario: patent-oa-chain
profile: headless
composition: patent-jobs
recording: live
header:
  class: patent-jobs
input:
  task: |
    这是一件审查意见答复作业的整链执行，只做下面两步，不使用 shell，不读写工作区里的其它文件。

    第 1 步：调用 patent_workflow_run，参数为 manifestId="patent_oa_response_v1"，input 传下面这段通知书原文，claims 传下面这段权利要求书，两处都必须逐字原样传入（不要改写、不要省略）：

    通知书原文：
    本申请涉及一种阀体伴热夹套结构。审查员认为权利要求 1-2 不具备创造性，不符合专利法第 22 条第 3 款的规定。对比文件 1（CN101234567A，X 类）公开了权利要求 1 中记载的阀体与直管加热结构。因此权利要求 1 不具备突出的实质性特点。

    权利要求书：
    1. 一种阀体伴热夹套结构，其特征在于，包括阀体和设置在阀体外侧的伴热夹套，所述伴热夹套内设有螺旋形加热介质通道。
    2. 根据权利要求 1 所述的结构，其特征在于，所述伴热夹套的材质为不锈钢。

    该链运行到"人工确认答复书"这一步会暂停等待人工确认，这是预期行为。

    第 2 步：如果第 1 步返回了审批门暂停，就再调用一次 patent_workflow_run，参数与第 1 步完全相同，另外传 approveStageIds=["approval"]，让整链跑到完成。

    最后用一句话说明两次调用的结果（第一次停在哪个阶段、第二次是否完成）。
