        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          专利复审委员会对宣告专利权无效的请求应当及时审查和作出决定，并通知请求人和专利权人。宣告专利权无效的决定，由国务院专利行政部门登记和公告。
          对专利复审委员会宣告专利权无效或者维持专利权的决定不服的，可以自收到通知之日起三个月内向人民法院起诉。人民法院应当通知无效宣告请求程序的对方当事人作为第三人参加诉讼。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
