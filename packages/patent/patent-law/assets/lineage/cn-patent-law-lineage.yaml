# 《专利法》法条沿革快照 — 随包资产。
#
# 记录每条法条跨修订版本的沿革数据。覆盖 1984 年原始文本、1992 年第一次修正、
# 2000 年第二次修正、2008 年第三次修正与 2020 年第四次修正五个版本。
# 1984 与 1992 年版本的条文文本尚未逐条核验，标记为 unverified。
#
# 条号体系：按 2020 年修正编号。2000→2020 的条号映射见末尾的映射注释段。
#
# 数据来源：2000 年修正版全文来自北大法宝；2020 年修正版为官方全文。
# 1984 年原始文本与 1992 年第一次修正版文本待后续转录核验。

