id: "wp-spec-invention-content"
name: "发明内容三要素——技术问题、技术方案、有益效果（内容要素，不是标题）"
category: "spec_drafting"
sub_category: "invention_content"
summary: "发明内容部分必须包含三项内容要素：所要解决的技术问题（基于现有技术的缺陷提炼）、技术方案（对应权利要求，但用自然语言描述）、有益效果（与技术方案一一对应，有数据支撑）。三项都是内容要素：以自然段落平铺书写，不得写成小标题——说明书只允许《专利法实施细则》第二十条规定的五部分标题（技术领域、背景技术、发明内容、附图说明、具体实施方式）。"
context: "适用于所有专利说明书的发明内容部分。"
quality: 0.85
version: 1
steps:
  - order: 1
    name: "写明所要解决的技术问题"
    instruction: "直接从背景技术的缺陷提炼。每个缺陷对应一个技术子问题。注意：技术问题不等于’成本高’’效率低’——应该是技术层面的具体问题。以自然段落书写，不要为它加小标题。"
    example: "本实用新型要解决的技术问题是：现有保护罩缺乏透气设计，在盐碱地高温+强光照环境下易导致幼苗烧苗。"
  - order: 2
    name: "写明技术方案"
    instruction: "与权利要求对应但用自然语言描述。对独立权利要求逐特征展开，对从属权利要求可省略或简要提及。以自然段落书写，不要为它加小标题。"
    example: "为实现上述目的，本实用新型提供如下技术方案：一种盐碱地苜蓿幼苗保护罩，包括罩体和底座；所述罩体顶部设有透气调节装置……"
  - order: 3
    name: "写明有益效果"
    instruction: "与技术方案一一对应。每个效果都要能回溯到具体的结构/方法特征。最好有对比数据或定量分析。以自然段落书写，不要为它加小标题。"
    example: "与现有技术相比，本发明的有益效果是：通过设置透气调节装置，可使罩内温度较环境温度降低5-8℃，有效防止高温烧苗……"
dos:
  - rule: "技术问题必须是技术层面的，而非商业/管理层面的"
  - rule: "有益效果与技术方案一一对应，不编造不存在的好处"
  - rule: "三项内容要素以自然段落平铺，靠段落顺序区分即可，不靠标题区分"
donts:
  - rule: "技术方案不写入非必要特征——独立权利要求中没写的，这里也不写"
  - rule: "不得把「要解决的技术问题」「技术方案」「有益效果」写成标题：《专利法实施细则》第二十条只规定说明书五部分标题，自加标题不符合提交体例"
