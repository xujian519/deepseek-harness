# 专利费用索引（专利申请、授权与程序事项的官费条目）
#
# 本文件登记"有哪些费种、在什么阶段缴、按什么基准计数、能减缴到什么程度"，
# 不登记价格：每个条目的 amount 以及它的 sourceDoc / effectiveFrom / verifiedOn
# 是转录字段，由人工按官方收费标准公告逐项录入并签名核验。随包文件里 amount
# 全部为 null，因此 patent_fees 只报适用性与计数，不给任何金额，也不给合计。
# 该条目未转录不是"免费"，是"未核验"。
#
# 语义（转录时按此读，不要另作解释）：
# - trigger      该费种在哪个环节产生，由查询的 triggers 选中。
# - patentTypes  适用对象；null 表示未限定（三种专利类型都适用）。
# - basis        计数基准：per-case 每件；per-claim-beyond 超过 freeUnits 项的每项；
#                per-page-beyond 超过 freeUnits 页的每页；per-priority 每项优先权要求；
#                per-annuity-year 每个专利年度；per-month 每请求月数。
# - freeUnits    计数的免费基数（仅 beyond 类基准使用）。
# - amount       单价，元，字符串；null 表示未转录。
# - reducible    是否属于费用减缴范围；null 表示未登记。true 的条目按 reductions 的比例计算。
# - reductionMaxYears  年费类条目减缴覆盖的最高专利年度；null 表示未登记。
# - tiers        年费分档（fromYear / toYear / amount）；空表示分档未转录，工具按年度列出但不给金额。
# - latePayment  滞纳金规则：monthlyPercent 为每超过缴费时间 1 个月加收当年全额年费的百分比，
#                maxMonths 为可补缴的月数上限。
#
# 已带值而非 null 的字段，其来源都是本仓已有的陈述，随包不构成已核验：
# - 权利要求附加费免费基数 10 项、说明书附加费免费基数 30 页、
#   legalBasis 第110条第1款第（一）项：本仓 patent-tools 的 draft-claims 注释。
# - 年费 legalBasis 第115条、滞纳金每月 5%、补缴窗口 6 个月：本仓 patent-deadline
#   的年费条目与其说明。
# - 实审费 legalBasis 第35条、复审请求费 legalBasis 第41条第1款、宽限费 legalBasis
#   第120条：本仓 patent-deadline 的对应条目。
# 其余 legalBasis 留 null，因为本仓没有可复用的依据，不凭记忆补条号。
# 未核验的字段仍是"待核定内容"：本仓此前已记录细则条号存在 2010 版与 2020 版
# 混用的风险，转录时须逐条对照现行条文。
document: 国家知识产权局专利收费标准
revision: null
currency: CNY
sourceDoc: null
effectiveFrom: null
verifiedOn: null

# 费用减缴。reductionPercent 是减缴比例（应缴 = 全额 × (1 − reductionPercent / 100)），
# 例如 85 表示只缴 15%。requiresFiling 表示该减缴以事前办理费减备案为前提。
reductions:
  - kind: individual
    label: 个人
    reductionPercent: null
    requiresFiling: true
    sourceDoc: null
    verifiedOn: null
  - kind: enterprise
    label: 企业
    reductionPercent: null
    requiresFiling: true
    sourceDoc: null
    verifiedOn: null

