# Publish an unsigned Windows x64 desktop build to a GitHub Release.
#
# The unsigned packaging mode carries no Authenticode signature, writes no release
# completion record, and configures no updater, so the repository's upload:* (Tencent
# COS) publication path refuses it; GitHub Releases is its only distribution channel.
# The macOS counterpart is desktop-unsigned-release.yml.
#
# Packaging runs on the standard GitHub-hosted Windows image, which needs no self-hosted
# runner and no signing, upload, or Apple credential. The image's Visual C++ Build Tools
# and Windows SDK compile the installer's native helper, and the packaged runtime is
# prepared exactly as a release build prepares it.
name: Desktop (unsigned, Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; empty publishes desktop-unsigned-win-v<version>.
        type: string
        required: false
        default: ''
      draft:
        description: Leave the release as a draft for manual publication.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # Publication is a transaction: a later dispatch waits instead of cancelling a
  # release whose assets are already uploading.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  win-x64:
    name: win-x64 (unsigned)
    runs-on: windows-latest
    # The packaged runtime carries the complete dsh dependency closure and the
    # LibreOffice conversion engine, so one build owns the whole job budget.
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # PowerShell reports a step's status from its own exit code, so every native
        # command that may fail propagates its status explicitly.
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE

      - name: Write the packaging environment
        # Packaging reads every release field from apps/desktop/.env.windows and never
        # falls back to shell variables, so the file must exist before the build. An
        # unsigned Windows build needs the application id and the policy origin that
        # packaged applications carry; it needs no signing, upload, or notary input.
        env:
          UPDATE_ORIGIN: ${{ vars.DSH_MANDATORY_UPDATE_ORIGIN }}
        run: |
          if (-not $env:UPDATE_ORIGIN) {
            throw 'Set the repository variable DSH_MANDATORY_UPDATE_ORIGIN to the HTTPS origin your builds carry.'
          }
          $content = @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=$env:UPDATE_ORIGIN"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/.env.windows'), $content + "`n")

      - name: Build the installer
        run: |
          pnpm --dir apps/desktop run package win-x64 --unsigned
          exit $LASTEXITCODE

      - name: Collect the installer and its digest
        run: |
          $artifacts = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installer = Get-ChildItem -LiteralPath $artifacts -Filter '*-win-x64-unsigned.exe' | Select-Object -First 1
          if (-not $installer) { throw "No unsigned installer under $artifacts" }
          $version = node -p "require('./apps/desktop/package.json').version"
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($installer.FullName).sha256", "$digest  $($installer.Name)`n")
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "INSTALLER=$($installer.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "INSTALLER_DIGEST=$($installer.FullName).sha256"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "VERSION=$version"

      - name: Upload the packaging journal
        # The journal carries the phase timeline and redacted child output of a failed
        # run, which is the only record a cancelled or failed build leaves behind.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: win-x64-packaging-journal
          path: apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: ignore

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # This step reads native exit codes itself, so a non-zero status must not
          # become a terminating error.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = if ($env:REQUESTED_TAG) { $env:REQUESTED_TAG } else { "desktop-unsigned-win-v$env:VERSION" }
          # A release is created as a draft so a re-run replaces assets on a release
          # that is not yet visible, and only a complete upload turns it public.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA `
              --title "DeepSeek Harness $env:VERSION (unsigned, Windows x64)" `
              --notes-file .github/desktop-unsigned-windows-release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Creating release $tag failed" }
          }
          gh release upload $tag $env:INSTALLER $env:INSTALLER_DIGEST --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading assets to $tag failed" }
          if ($env:DRAFT -ne 'true') {
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Publishing release $tag failed" }
          }
          gh release view $tag --json url --jq .url
