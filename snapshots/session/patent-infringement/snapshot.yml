input:
  task: |
    这是一件侵权比对分析的收口作业。只做下面一步，不调用其它工具，不使用 shell，不读写工作区里的其它文件。

    调用 patent_workflow，参数 manifestId 传 patent_infringement_v1，caseId 传 CN2024-0004，outputs 传五个阶段：stageId 依次为 parse、claim-chart、coverage、report、approval，每个阶段的 text 各写一句中文（parse 写权利要求与被控产品材料要点，claim-chart 写要素级映射要点，coverage 写全面覆盖与等同核验结论，report 写比对报告要点，approval 写"已人工确认"）。

    最后用一句话说明这次调用的结果。
