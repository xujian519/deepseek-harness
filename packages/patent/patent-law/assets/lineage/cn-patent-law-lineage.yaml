  - articleId: 75
    title: "不视为侵权"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          有下列情形之一的，不视为侵犯专利权：
          （一）专利权人制造、进口或者经专利权人许可而制造、进口的专利产品或者依照专利方法直接获得的产品售出后，使用、许诺销售或者销售该产品的；
          （二）在专利申请日前已经制造相同产品、使用相同方法或者已经作好制造、使用的必要准备，并且仅在原有范围内继续制造、使用的；
          （三）临时通过中国领陆、领水、领空的外国运输工具，依照其所属国同中国签订的协议或者共同参加的国际条约，或者依照互惠原则，为运输工具自身需要而在其装置和设备中使用有关专利的；
          （四）专为科学研究和实验而使用有关专利的。
          为生产经营目的使用或者销售不知道是未经专利权人许可而制造并售出的专利产品或者依照专利方法直接获得的产品，能证明其产品合法来源的，不承担赔偿责任。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
