id: "wp-oa-novelty-separate"
name: "新颖性单独对比 OA 答复"
category: "oa_novelty"
summary: "答复新颖性驳回的核心要点：坚持单独对比原则——只能将一份对比文件与权利要求逐一比对，不得组合多篇对比文件。核心争辩路径：对比文件未公开全部技术特征→具备新颖性；同时核对抵触申请、数值范围、优先权日和宽限期等特殊情形。"
context: "适用于答复审查意见中关于专利法第22条第2款（新颖性）的驳回理由。"
keywords: ["新颖性", "单独对比", "对比文件", "抵触申请", "惯用手段", "上下位", "数值范围", "优先权", "宽限期"]
source_ref: "专利法第22条第2款；专利法第24条；专利法第29条；审查指南第二部分第三章第2.1节；审查指南第二部分第三章第3.2.4节；审查指南第二部分第三章第5节"
quality: 0.90
version: 1
steps:
  - order: 1
    name: "确认审查员的对比路径"
    instruction: "复述审查员引用的对比文件及其认定公开的内容。注意区分是’单独对比’还是’组合对比’——后者直接违反新颖性审查原则。"
    example: "审查员认为对比文件1公开了权利要求1的全部技术特征。经仔细比对，对比文件1并未公开权利要求1的如下技术特征：……"
  - order: 2
    name: "逐项比对技术特征"
    instruction: "将权利要求的每个技术特征与对比文件公开的内容逐一比对，列出对比表。对于未被公开的特征，明确指出对比文件中什么位置公开了哪些内容、缺少哪些内容。"
    example: "| 权利要求1的特征 | 对比文件1公开的内容 | 比对结果 |\n|---|---|---|\n| 伴热夹套 | 未公开 | ❌ 未公开 |\n| 内置加热棒 | 电热丝（位置不同） | ❌ 区别 |"
  - order: 3
    name: "新颖性结论"
    instruction: "存在至少一个未被对比文件公开的技术特征→具备新颖性。注意：惯用手段直接置换、上下位概念等情形仍需单独说明。"
    example: "权利要求1的技术方案与对比文件1相比，至少存在’伴热夹套’这一区别技术特征，该特征未被对比文件1公开，也不属于惯用手段的直接置换。因此，权利要求1具备专利法第22条第2款规定的新颖性。"
  - order: 4
    name: "核对特殊情形"
    instruction: "结论前逐项核对：（1）抵触申请：任何单位或者个人（包括申请人自己）就同样的发明或者实用新型在申请日以前提出、在申请日以后公布的申请，同样破坏新颖性；抵触申请不属于现有技术，不能与其他对比文件组合。（2）数值范围：对比文件公开的数值或范围落在权利要求范围内、与权利要求范围部分重叠或共用一个端点，破坏新颖性；对比文件范围的两个端点只破坏权利要求中相应端点值的新颖性，不破坏端点之间其他离散值的新颖性；权利要求范围落在对比文件范围内且无共同端点，不破坏新颖性。（3）优先权：有效优先权的，判断基准是优先权日而非实际申请日。（4）宽限期：专利法第24条的六个月内四种情形不破坏新颖性，但宽限期不等于优先权，公开日不视为申请日。"
    example: "本申请要求了在先申请的优先权，优先权日为2023年3月1日，对比文件1的公开日为2023年3月15日，晚于优先权日，不构成现有技术。另需确认对比文件不属于他人在优先权日前提出、优先权日后公布的抵触申请。"
dos:
  - rule: "严格单独对比——不引入第二篇对比文件来否定新颖性"
  - rule: "对比表让审查员一目了然地看到差异点"
  - rule: "先确认优先权是否有效、对比文件公开日与申请日/优先权日的先后，再进入特征比对"
donts:
  - rule: "新颖性争辩中不使用多篇对比文件组合"
  - rule: "不要混淆新颖性和创造性——新颖性只看是否被单独一篇公开"
  - rule: "不要把抵触申请当作现有技术，也不要将其与现有技术或其他对比文件组合使用"
  - rule: "不要用宽限期替代优先权——宽限期只排除特定公开对新颖性的影响，不改变申请日"
