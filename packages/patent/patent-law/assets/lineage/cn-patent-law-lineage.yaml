  - articleId: 22
    title: "新颖性创造性实用性"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          授予专利权的发明和实用新型，应当具备新颖性、创造性和实用性。
          新颖性，是指在申请日以前没有同样的发明或者实用新型在国内外出版物上公开发表过、在国内公开使用过或者以其他方式为公众所知，也没有同样的发明或者实用新型由他人向国务院专利行政部门提出过申请并且记载在申请日以后公布的专利申请文件中。
          创造性，是指同申请日以前已有的技术相比，该发明有突出的实质性特点和显著的进步，该实用新型有实质性特点和进步。
          实用性，是指该发明或者实用新型能够制造或者使用，并且能够产生积极效果。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 23
    title: "外观设计授权条件"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: "授予专利权的外观设计，应当同申请日以前在国内外出版物上公开发表过或者国内公开使用过的外观设计不相同和不相近似，并不得与他人在先取得的合法权利相冲突。"
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 24
    title: "宽限期"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          申请专利的发明创造在申请日以前六个月内，有下列情形之一的，不丧失新颖性：
          （一）在中国政府主办或者承认的国际展览会上首次展出的；
          （二）在规定的学术会议或者技术会议上首次发表的；
          （三）他人未经申请人同意而泄露其内容的。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 25
    title: "不授予专利权"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          对下列各项，不授予专利权：
          （一）科学发现；
          （二）智力活动的规则和方法；
          （三）疾病的诊断和治疗方法；
          （四）动物和植物品种；
          （五）用原子核变换方法获得的物质。
          对前款第（四）项所列产品的生产方法，可以依照本法规定授予专利权。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 26
    title: "充分公开"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          申请发明或者实用新型专利的，应当提交请求书、说明书及其摘要和权利要求书等文件。
          请求书应当写明发明或者实用新型的名称，发明人或者设计人的姓名，申请人姓名或者名称、地址，以及其他事项。
          说明书应当对发明或者实用新型作出清楚、完整的说明，以所属技术领域的技术人员能够实现为准；必要的时候，应当有附图。摘要应当简要说明发明或者实用新型的技术要点。
          权利要求书应当以说明书为依据，说明要求专利保护的范围。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
        changed: false
        source: "第十一届全国人民代表大会常务委员会第六次会议"
      - revision: "2020-amendment"
        effectiveDate: "2021-06-01"
        text: null
        changed: false
        source: "第十三届全国人民代表大会常务委员会第二十二次会议"
  - articleId: 27
