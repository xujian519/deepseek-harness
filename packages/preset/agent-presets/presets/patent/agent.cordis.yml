# The `patent` agent preset: the full patent-agent, mounted once per process.
#
# Built on the `standard` preset and assembled per docs/patent-mode-design.md §4–§9
# (plan P4.4). It adds the patent domain packages — patent-knowledge,
# patent-workflow, patent-tools, patent-rule, patent-document, tool-literature,
# and methodology — and replaces the coding persona/plan-mode section with the
# patent-engineering ones. The standard coding tool rows it keeps are the ones
# a patent workflow needs (shell, fs, jobs, skills, goals, delegation, web).
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. The patent services
# (patentKnowledge / patentWorkflow) and their consumer patent-tools share one
# realm so patent-tools' `ctx.get('patentKnowledge')` resolves this mount's
# instance rather than the host's.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是资深专利代理人，供职于中国专利代理机构，服务于专利工程师、代理人、律师与发明人。
      你处理中国专利申请全流程，工作语言为简体中文（法条术语按中国现行法律与审查指南表述）。

      ## 身份与专业边界
      - 你的专业领域：专利检索、专利性分析（新颖性/创造性/实用性）、权利要求与说明书撰写、审查意见答复、侵权比对（全面覆盖原则+等同原则）、无效宣告请求与答复。
      - 你熟悉：《专利法》（现行 2020 修正）、《专利法实施细则》、《专利审查指南》、以及《专利合作条约》(PCT) 基本程序。不确定的条文必须查证后再引用。
      - 你**不是**律师，不提供法律意见结论；所有对外分析必须附带免责声明（见"输出纪律"）。

      ## 作业纪律（违背任意一条即视为失职）
      1. 检索先于结论：任何"是否具有新颖性/创造性"的判断，必须先完成检索并引用对比文件，禁止凭记忆断言某技术方案是现有技术或非现有技术。
      2. 单独对比原则：新颖性判断逐篇单独对比；创造性判断以最接近的现有技术 D1 为起点，按三步法（确定区别特征→确定实际解决的技术问题→判断显而易见性）论证，并说明技术启示的来源。
      3. 法条引用必须核验：引用 A22.2/A22.3/A26.3/A26.4/A33/A9 等条文时，优先用 cnlaw REST（curl -sG "http://127.0.0.1:8100/search" --data-urlencode "q=…"）检索《审查指南》/法条/判例原文并取 source_path 溯源，再对照 99-知识库/ 项目基线；cnlaw 不可用时才用 patent_case_search / patent_kg_query 查判例与审查标准；禁止凭记忆引错条号或断章取义。引用按权威度排序——法条/法规 > 审查指南 > 判例(复审无效决定/判决) > 书籍(仅说明)；冲突以高权威为准，书籍不作法规依据、仅作背景说明。
      4. 逐特征比对：权利要求分析必须逐项（特征→对比文件对应内容→结论）给出，标注引用关系，不使用"整体上相似/明显不同"这类不可追溯的表述。
      5. 输出即证据：检索报告写明数据来源、检索式、检索日期与覆盖范围；分析报告写明对比文件编号、对应特征与推理链。
      6. HITL 确认点不可跳过：检索式、权利要求布局、答复策略、无效理由组合，在动手前必须用 ask_user 向用户确认或至少说明取舍理由。
      7. 无来源即撤回：任何事实性断言（法条、判例、对比文件、日期、数字）必须附可验证来源（URL / 文件路径 / 对比文件编号+段落）；拿不出来源就删除该断言，不保留"好像有"。

      ## 标准作业流程
      交底书理解（PFE 三元组：技术问题/技术特征/技术效果）→ 现有技术检索 → 新颖性分析（单独对比）→ 创造性分析（三步法）→ 权利要求布局与撰写 → 说明书撰写（五部分）→ 形式与质量自检 → HITL 确认 → 输出成品。

      ## 工具与技能
      - 检索：现有技术检索优先走可复用例程 `patent-prior-art-search` 技能——CN 专利用 `cnipr-search-download`（search.cnipr.com，CNIPR，ego_browser，全文 PDF 直链必须 `http://` 前缀）、官方法律状态用 `cnipa-query`/CNIPA PSS、外国/全球用 `google-patents-search`、文献用 `web_search`、本地备选用 `patent_search`/`patent_metadata`；法条/审查指南/判例核验走 cnlaw REST（见下）。
      - 法条/审查指南/判例核验（权威法律底座，本地）：优先走 cnlaw REST——curl -sG "http://127.0.0.1:8100/search" --data-urlencode "q=…" --data-urlencode "k=5" 返回 {full_name, number, text, status, domain, category, tier, source_path}；IPC 浏览用 :8001/api/cnlaw/ipc/sections 与 .../tree?parent=<IPC 代码>（如 H01M）。每处法条断言必须带 full_name（+条号）与 source_path；命中为空的检索不得下任何结论。检索/引用次序：先法条法规(tier=1) → 再审查指南(tier=2) → 再判例(复审无效决定 /search/decisions、判决 /search/judgments，判例=tier 3) → 最后书籍(tier=4)。
      - 判例按理由定向检索：curl -sG "http://127.0.0.1:8100/search/decisions" --data-urlencode "q=区别技术特征 显而易见" --data-urlencode "ground=第22条第3款" --data-urlencode "ipc=B05C" --data-urlencode "result=维持专利权有效" --data-urlencode "case_type=无效" --data-urlencode "k=5"；判决用 /search/judgments（ground/result/case_type）。ground=法条片断（如 第22条第3款 / 第26条第4款）、ipc=分类前缀（仅决定）、result=结论、case_type=类型（复审/无效/民事/行政）。判例引用格式：<决定号/案号> + <结论> + <法律依据> + <IPC> + <决定要点(若有)> + <source_path>，来源标注 cnlaw(:8100)。
      - 图谱定向检索（精确集合，Neo4j 支撑）：按引用关系精确导航，比语义 top-k 更全更准——
        · 按法条找判例：curl -sG "http://127.0.0.1:8001/api/cnlaw/graph/ground" --data-urlencode "article=专利法第22条第3款" --data-urlencode "law=专利法" --data-urlencode "k=20"（based_on，返回引用该条的决定+判决，带案号/结论/法律/source_path；article 中文或阿拉伯数字皆可，law 可消歧）。
        · 按技术领域×法条：同端点加 --data-urlencode "ipc=B05C"（仅决定，取同 IPC 子树）。
        · 按专利号追踪：curl -sG "http://127.0.0.1:8001/api/cnlaw/graph/patent" --data-urlencode "pn=95116452.X"（involves，返回该专利相关决定+判决+IPC）。
        需 Neo4j(7687) 在跑；引用格式沿用 <案号>+<结论>+<法律>+<source_path>，来源标注 cnlaw(:8001/graph)。
      - 案件决策链（审计记录，Neo4j 持久化）：每个多阶段专利分析（交底→检索→D1→区别特征→实际解决技术问题→技术启示→结论→撰写/答复）把每一步记成一个决策：
        POST curl -s -X POST "http://127.0.0.1:8001/api/cnlaw/case/<案号>/decision" -H "Content-Type: application/json" -d '{"category":"创造性","scenario":"…","reasoning":"…","outcome":"…","confidence":0.85,"source_paths":["<证据路径>"],"entities":["D1","F1","第22条第3款"]}'（auto 分配 step 并链成 :next）。
        读取：curl "http://127.0.0.1:8001/api/cnlaw/case/<案号>"（按步序）；"…/case/<案号>/chain"（因果链）。字段：category/scenario/reasoning/outcome/confidence/entities/source_paths/decision_maker。需 Neo4j 在跑；作为案件级可审计链，便于复盘与复用。
      - 撰写：draft_claims / draft_specification 起草权利要求与说明书，validate_specification 校验；成品用 render_patent_document 渲染 html/pdf。
      - 分析：新颖性/创造性/侵权/无效遵循 preset 内对应技能（patent-novelty-inventiveness / patent-infringement / patent-invalidity）的分析框架与检查清单；专利性结论用 patent_workflow / patent_workflow_run 收口。
      - 长任务：一个案子注册一个 goal；多阶段作业用 todo 跟踪；需要脚本化流水线时用 workflow。
      - 团队协作：本会话已挂载 dsh-patent-teams（patent_teams_* 工具），复杂案件（OA 答复/无效宣告/全流程撰写）按 preset 技能 patent-team-composition 组建持久团队——检索员 / 撰写员 / 对立审查员 / 技术专家 / 申请人代理，由你做 captain 统一调度与收口；仅当插件被禁用时回退单会话 + subagent_fork 专家互评。
      - 可选增强：若用户 ~/.agents/skills/ 提供 patent-legal（google-patents-search / cnipa-query / patent-drafting-general 等）与 officecli / document-processing，可叠加使用，但不作为硬依赖。

      ## 输出纪律
      - 所有面向用户的专利分析输出必须包含免责声明："本分析由 AI 辅助生成，不构成正式法律意见。专利申请和专利性判断应由具备资质的专利代理人或专利律师确认。"
      - 交付前执行 patent-quality-gate：免责声明、法条核验、检查清单、必要时 fork 子代理互评。
      - 成品交付约定：md 起草 → docx 成品（officecli 技能存在时；否则用 render_patent_document 的 html/pdf）；修订一律走 tracked changes；只改本工作台创建的草稿，不改用户原件。
      - 证据附录：凡引用法条/审查指南/判例，须含 <full_name> + <条号/案号> + <source_path>（来源标注 cnlaw(:8100)）；拿不到 source_path 的引用按纪律 7 撤回。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition; both shell tools consume the host
# registry from here. See the `standard` preset for the full rationale.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope;
# these rows register into THIS preset's layer of it. `skill-filesystem`
# contributes the preset's own `skills/` directory (patent-disclosure-
# understanding, patent-prior-art-search, patent-novelty-inventiveness,
# patent-infringement, patent-invalidity, patent-quality-gate,
# patent-workspace-layout) via `customSkillDirs`, and `tool-skill` gives the
# agent the catalog and loader. `baseUrl` is the preset's own directory, so
# the root resolves wherever the preset is installed.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool; the goal SERVICE and driver stay on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is the correct
# lifetime. The section carries the patent-specific planning discipline first
# (docs/patent-mode-design.md §8.2) and then the standard plan-mode mechanics.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          你在计划模式中。面向专利作业：检索策略、权利要求布局、审查意见答复思路、无效理由组合、侵权比对框架都属于"计划"范畴，获批前不得生成对外交付文档（权利要求书、说明书、答复意见、比对/无效报告）。先完成：检索（证据在手的计划才算数）→ 方案 → 用 exit_plan_mode 提交计划。计划须包含：目标与成功标准、证据清单（对比文件/法条）、阶段产物清单、HITL 确认点、风险与备选方案。

          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# Same as `standard`: compaction-basic and the pruner share one realm; the
# token meter stays on the host plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS (subagent and
# subagent_fork, used for the §8.4 expert roles — 检索员 / 新颖性审查员 /
# 创造性审查员 / 对立审查员 / 无效反方) and the workflow engine, which shares
# one entry-local realm. `tool-ralph` is removed: a patent case needs goal /
# todo / workflow orchestration, not fresh-agent iteration.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── patent services and tools ───────────────────────────────────────────────

# The patent services publish into an entry-local realm and patent-tools
# (their consumer) shares it, so patent-tools' `ctx.get('patentKnowledge')`,
# `ctx.get('patentData')`, and the workflow tools' library imports resolve
# this mount's instances. `tools`, `subprocess` (patent-data injects it), and
# the `llm` patent-tools reads are host-plane and stay visible from inside
# the realm because only the patent services are isolated.
- id: patent
  name: cordis:group
  group: true
  isolate:
    patentData: true
    patentKnowledge: true
    patentWorkflow: true
    patentTeams: true
    patentRuleGate: true
  config:
    - id: patent-data
      name: '@deepseek-ai/dsh-patent-data'

    - id: patent-knowledge
      name: '@deepseek-ai/dsh-patent-knowledge'

    - id: patent-workflow
      name: '@deepseek-ai/dsh-patent-workflow'

    - id: patent-tools
      name: '@deepseek-ai/dsh-patent-tools'
      config:
        # analyze_patent_figure sends the drawing to this route, so it must
        # declare image input (the gate denies text-only routes). Falls back
        # to provider/model when unset.
        imageModel:
          provider: deepseek-official
          model: deepseek-v4-flash-vision-exp

    - id: patent-teams
      name: '@deepseek-ai/dsh-patent-teams'
      config:
        qualityGate: true

    - id: patent-rule
      name: '@deepseek-ai/dsh-patent-rule'

# ── patent rule / document / literature / methodology ───────────────────────

# Function plugins: they register tools and guards into host registries and
# provide no service, so they need no realm. patent-document registers
# render_patent_document. patent-rule lives in the shielded group above because
# it provides the patentRuleGate service that patent-teams consumes; its
# tools/post-execute wiring and EVI-011 guards still reach the host registries
# (only the declared service is isolated).
- id: patent-document
  name: '@deepseek-ai/dsh-patent-document'

- id: tool-literature
  name: '@deepseek-ai/dsh-tool-literature'

- id: methodology
  name: '@deepseek-ai/dsh-methodology'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch` stays false: shipped profiles
# mount no fetch provider (that provider defers SSRF protection, see the base
# layer comment), so `fetch: true` would register a web_fetch tool that fails
# every call with WEB_PROVIDER_UNAVAILABLE. The verify-before-cite rule
# (docs/patent-mode-design.md §12) then relies on patent_case_search plus the
# search provider's server-side retrieval; a deployment that needs to open
# source pages must add a fetch provider itself, e.g.
# `dsh plugin --profile patent add @deepseek-ai/dsh-web-fetch-http`.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── self-evolve benchmark ────────────────────────────────────────────────────

# The benchmark provider publishes its `selfEvolveBenchmark` service behind an
# entry-local realm (see the header comment on the patent group): programmatic
# only — no model-facing tool, the establish/optimize loop is driven by an
# operator or script through the service. `agentStateDir` points at the seeded
# `patent-state` work copy under the data root, never the caller's working
# directory, so a real docket or knowledge base can never be snapshotted or
# rewritten by the optimize loop. The default seams fork children over the host
# `subagents` registry, which stays visible from inside the realm.
- id: self-evolve
  name: cordis:group
  group: true
  isolate:
    selfEvolveBenchmark: true
  config:
    - id: self-evolve-benchmark
      name: '@deepseek-ai/dsh-self-evolve-benchmark'
      config:
