# 《专利法》条号索引 — 随包资产，内容尚未核定。
#
# 本文件只登记"有哪些条、每条大致管什么"，用于判定一条引用是否落在索引内、
# 以及引用所支撑的命题是否与条目主题相符。它不是法条文本。
#
# 来源与核定状态：
#   - 条号与主题取自本仓库既有的引用核验表（packages/patent/patent-workflow/src/quality-gate.ts
#     的 PATENT_LAW_TOPICS、packages/patent/patent-rule/assets/rules/patent/compliance.yaml、
#     base/citation.yaml）以及仓库内规则资产 / 技能中已出现的引用，未对条文原文核定。
#   - maxArticle（82 条）同样取自上述既有条目，maxVerifiedOn 为 null，即该上限本身未核验：
#     编号超过 82 的引用只报"未核验"，不判"超出范围"。
#   - 已发现仓库既有表中第 62、69、70 条的主题（现有技术抗辩 / 不视为侵权 / 合法来源）
#     与同一仓库他处使用的 2020 修正条号（第 71 条损害赔偿、第 74 条三年时效）不是同一版本
#     的编号体系，疑为 2010 年版条号。核定前不得据本索引断定条号正确。
#
# 核定方式：由具备资质者按官方文本逐条补 text / sourceDoc / verifiedOn（以及 paragraphs）；
# 补录前每条引用的判定都是"未转录（未核验）"，永远不会被当作已核验通过。
