id: "wp-embodiment-writing"
name: "说明书具体实施方式撰写——至少一个完整实施例"
category: "embodiment"
summary: "具体实施方式是说明书充分公开和支持权利要求的重要基础。核心要求：使本领域技术人员能够实施，通常至少给出一个完整的具体实施例，包含可验证的参数和效果数据。"
context: "适用于发明和实用新型专利说明书的具体实施方式部分。"
keywords: ["具体实施方式", "实施例", "参数", "参数范围", "效果数据", "充分公开"]
source_ref: "专利法第26条第3款；专利法实施细则第20条第1款"
quality: 0.85
version: 1
steps:
  - order: 1
    name: "确定实施例的数量和覆盖范围"
    instruction: "通常至少给出一个完整实施例，覆盖独立权利要求的全部必要技术特征。对于较宽的上位概括，应给出足以让本领域技术人员合理预测的多个实施方式。实施例数量没有一刀切标准，取决于概括范围和技术领域的可预测性。"
  - order: 2
    name: "参数具体化"
    instruction: "实施例中的参数应具体到本领域技术人员能够实施。方法发明可以用参数或参数范围表示工艺条件；使用范围时，应给出端点、至少一个中间值或足够的实施例支撑，且范围不应与权利要求一样宽。包括但不限于：尺寸、温度、压力、时间、流量、功率、材料牌号等。"
    example: "本实施例中，采用裂解萘馏分100m³储罐，伴热夹套的加热介质为蒸汽，温度为85-95℃，内置加热棒功率为500W，氮气吹扫流量为0.5-5L/min。"
  - order: 3
    name: "效果数据"
    instruction: "实施例中宜包含实施效果数据或对比数据，用于证明技术效果真实、可重复；预料不到的技术效果只是创造性辅助判断因素之一，不是每件申请都必须证明的门槛。"
    example: "经测试，采用本实施例三重防堵机制的呼吸阀，在连续运行72小时后密封面无萘结晶现象，而传统方案在运行8小时后即出现明显结晶。"
dos:
  - rule: "实施例的参数应具体到可实施；可以用单一数值或范围，但范围要有端点/中间值/实施例支撑，且不能与权利要求一样宽"
  - rule: "效果数据要真实、可重复；需要补交实验数据时，应确保其所证明的技术效果能从原申请公开的内容中得到"
donts:
  - rule: "不要用‘本领域技术人员知晓’一笔带过关键参数；对实现发明必不可少的内容应具体写明"
  - rule: "不把多个可以拆分的实施例混在一起写"
