# A row still spelling the field the 2026-09-06 system-prompt change replaced.
# Discovery reports this preset healthy — it judges composition shape and
# package resolution, never a row's config — so only the mount refuses it,
# which is what `mount.spec.ts` pins. The row names a local fixture plugin
# rather than the shipped persona package because the Loader resolves entry
# modules through Node's ESM resolver: a bare workspace name resolves to the
# package's built `lib/`, which no lane on a clean tree has.
- id: persona
  name: ../../plugins/requires-prefix.js
  config:
    text: persona prose
