# Live-recording patch: mount the patent-domain deadline plugin over the
# ordinary headless composition, so a recording pins the calendar asset the
# plugin loads at load time, the tool it registers, and the schema the model
# receives. The shipped `patent` agent preset owns this row for real sessions,
# but a preset is agent-plane and only `dsh-agent-preset-registry` can mount one, which
# the headless profile does not run.
#
# The recorded session deliberately never calls `patent_deadlines`: its report
# counts remaining days and urgency against the current date, which corpus
# normalization does not scrub, so a recorded call would stop replaying the
# next day. That package's own specs pin the computed dates and the report.

- insert:
    - id: patent-deadline
      name: '@deepseek-ai/dsh-patent-deadline'
