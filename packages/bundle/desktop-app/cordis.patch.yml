# The dsh-desktop-app bundle patch: the desktop surface over dsh-web-app.
# Applied after dsh-web-app's layer; rows here override web rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so the restated row
# below owns every key the web runtime reads.

# ── surface-specific overrides over dsh-web-app ─────────────────────────────

# The web runtime keeps its web values in the desktop profile: the URL line
# is the readiness signal the Electron main process parses. Desktop shell
# rows mount through packages/desktop/*; the shell service and the Electron
# directory picker are landed, remaining rows (menu, tray, shortcuts,
# notifications, drag-and-drop) arrive with further packages/desktop/*
# plugins.
- id: web-runtime
  config:
    # The Electron window is the UI surface; never hand the URL to the system
    # browser the way the web runtime does. The web-app layer reads this from
    # `--no-open`; the desktop surface pins it off so the shell stays the sole
    # viewer regardless of invocation flags.
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# ── desktop host glue ───────────────────────────────────────────────────────

- insert:
    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
    - id: desktop-shell
      name: '@deepseek-ai/dsh-desktop-shell'

# The web runtime's auto chooser mounts a native backend that would register
# `ctx.directoryPicker` alongside the Electron provider — but the seam allows one
# implementation per context, so disable the auto row and pin the Electron pair
# explicitly. The native browser surface drives the same pick RPC the electron
# capability serves, so the desktop reuses it to occupy the directory-flow holes
# (the auto row's own surface mount stays off with it).
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-desktop
      name: '@deepseek-ai/dsh-desktop-directory-picker'
    - id: ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

# The workspace sidebar is a first-party desktop default: explorer / editor /
# terminal / git tabs mounted beside the conversation. The host half hangs its
# routes and terminals off the web runtime's server; the client half is served
# through the client-modules roster like every dsh.client row. A deployment
# that does not want it opts out with a `- id: better-sidebar, disabled: true`
# row in the profile's own cordis.patch.yml, which applies after this layer.
- insert:
    - id: better-sidebar
      name: '@deepseek-ai/dsh-better-sidebar'
