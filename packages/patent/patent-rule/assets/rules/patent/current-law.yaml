# 现行法条口径校验规则（手写资产，非生成物镜像）
#
# 口径基准：2020 修正《专利法》+ 2023 修订《专利法实施细则》+ 2023 修订《专利审查指南》。
# 本文件只放"输出文本里出现已废止/失去依据的法条口径"这类可确定性判定的禁令：
# 一律 pattern_analysis（命中即违规），不使用 keyword_blocklist——输出门禁
# （src/runtime/output-gate.ts 的 selectGateRules）只取 keyword_blocklist，本文件
# 因此只作用于 rule_check 的显式自检，不改变既有输出门禁的行为。
# 未核验的条号按语义命名，不写未核验条号。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 侵权诉讼时效：现行期间为三年（民法典施行后统一），不再有"两年"口径
  # ---------------------------------------------------------------------------
  law_timelimit_three_years:
    id: LAW-TIMELIMIT-001
    name: 侵权诉讼时效期间（三年）
    domain: patent_infringement
    phase: 输出
    severity: major
    action: warn
    legalBasis: 民法典第188条：向人民法院请求保护民事权利的诉讼时效期间为三年
    check:
      type: pattern_analysis
      patterns:
        - '诉讼时效[^。；\n]{0,30}两\s*年'
        - '两\s*年[^。；\n]{0,10}(?:诉讼时效|侵权时效)'
        - '起诉前\s*两\s*年'

  # ---------------------------------------------------------------------------
  # 等同认定依据：应引现行司法解释；法释〔2001〕17 号已由 2016 修正替换
  # ---------------------------------------------------------------------------
  law_equivalence_basis:
    id: LAW-EQUIV-BASIS-001
    name: 等同认定依据（现行司法解释）
    domain: patent_infringement
    phase: 输出
    severity: major
    action: warn
    legalBasis: 法释〔2009〕20 号第 17 条（2016 修正）
    check:
      type: pattern_analysis
      patterns:
        - '法释\s*[〔\[（(]?\s*2001\s*[〕\]）)]?\s*第?\s*0*\s*17\s*[号条]'
        - '[〔\[（(]\s*2001\s*[〕\]）)]\s*0*\s*17\s*号'

  # ---------------------------------------------------------------------------
  # 实用新型客体：专利法第 2 条第 3 款（第 2 款是发明）
  # ---------------------------------------------------------------------------
  law_utility_model_subject_matter:
    id: LAW-UM-SUBJECT-001
    name: 实用新型客体条款（专利法第 2 条第 3 款）
    domain: patent_general
    phase: 输出
    severity: major
    action: warn
    legalBasis: 专利法第二条第三款：实用新型是指对产品的形状、构造或者其结合所提出的适于实用的新的技术方案
    check:
      type: pattern_analysis
      patterns:
        - '实用新型[^。；\n]{0,40}第二条第二款'
        - '第二条第二款[^。；\n]{0,40}实用新型'
