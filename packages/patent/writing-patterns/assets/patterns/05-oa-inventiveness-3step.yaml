id: "wp-oa-inventiveness-3step"
name: "创造性三步法 OA 答复框架"
category: "oa_inventiveness"
summary: "答复创造性的核心框架：第一步确认最接近现有技术和区别特征；第二步重新确定实际解决的技术问题（可与申请文件不同）；第三步从技术启示的三种常见情形论证非显而易见性；辅助判断因素（预料不到的技术效果、商业成功等）在三步法之外补强，不能替代三步法。"
context: "适用于答复审查意见中关于专利法第22条第3款（创造性）的驳回理由。"
keywords: ["创造性", "三步法", "非显而易见", "技术启示", "结合启示", "最接近现有技术", "实际解决的技术问题", "预料不到的技术效果"]
source_ref: "专利法第22条第3款；审查指南第二部分第四章第3.2.1.1节；审查指南第二部分第四章第5.3节；审查指南第二部分第四章第5.4节；审查指南第二部分第四章第6.2节；审查指南第二部分第四章第6.3节"
quality: 0.95
version: 1
steps:
  - order: 1
    name: "确认最接近现有技术和区别特征"
    instruction: "首先复述审查员认定的最接近现有技术，然后逐一指出权利要求与之的区别特征。注意：区别特征必须是权利要求明确记载的技术特征。"
    example: "审查员认定对比文件1（CNXXXXXXA）作为最接近现有技术。权利要求1与对比文件1的区别在于：本申请的伴热夹套内部设有螺旋形加热介质通道，而对比文件1的加热管为直管布置。"
  - order: 2
    name: "重新确定实际解决的技术问题"
    instruction: "基于区别特征在发明中所能达到的技术效果确定实际解决的技术问题。这个技术问题可以和申请文件声称的不同——审查指南允许重新确定。关键：要客观、具体，且与区别特征的技术效果相匹配。"
    example: "基于上述区别特征，本申请实际解决的技术问题是如何在有限空间内提高伴热介质与阀体的热交换效率，确保密封面温度均匀。"
  - order: 3
    name: "论证非显而易见性"
    instruction: "从现有技术整体上是否给出技术启示入手。审查指南通常认可三种情形：（i）区别特征属于公知常识，如解决该重新确定的技术问题的惯用手段，或教科书、技术词典、技术手册等工具书披露的手段；（ii）区别特征为同一份对比文件其他部分披露的技术手段，且该手段在该部分所起的作用与其在发明中的作用相同；（iii）区别特征为另一份对比文件披露的相关技术手段，且作用相同。反驳时要比较技术手段的实际作用，而不是仅比较文件声称的目的；作用相同才可能构成启示，作用不同则本领域技术人员没有动机引入该手段。"
    example: "对比文件2虽然公开了螺旋形通道，但该通道在对比文件2中的作用是延长介质停留时间，而本申请中螺旋形通道的作用是增大换热面积以提高热交换效率，二者作用不同。本领域技术人员面对’提高热交换效率’这一技术问题时，没有动机将对比文件2的螺旋形通道引入对比文件1。"
  - order: 4
    name: "用辅助判断因素补强"
    instruction: "三步法之外，可补充预料不到的技术效果（指南第二部分第四章第5.3节）、因技术特征直接导致的商业成功（第5.4节）等辅助因素。同时注意避免事后诸葛亮（第6.2节）：判断应基于申请日前的现有技术，而不是已知发明内容后的回溯。第6.3节明确：若按三步法已能认定非显而易见且产生有益技术效果，则不应再强调是否具有预料不到的技术效果；反之，缺少预料不到的技术效果也不是否定创造性的理由。"
    example: "本申请的螺旋形通道使换热效率较直管方案提高约40%，且该效果在申请日前无法从对比文件2的作用中预期，可作为非显而易见性的补强证据。"
dos:
  - rule: "每一个对比文件引用都要落到具体段落、附图或实施例，并说明该处技术手段的实际作用"
  - rule: "区别特征必须是权利要求中明确记载的——不能从说明书中拿特征来比"
  - rule: "辅助判断因素只用于补强三步法的结论，不能跳过三步法直接以’有技术效果’论证创造性"
donts:
  - rule: "避免空的三步法架子——每步必须有实质论证，不能只有步骤标题"
  - rule: "不要只说’对比文件未公开’，要说明对比文件公开了什么、区别在哪里"
  - rule: "不要仅以‘目的表述不同’认定无启示——应比较技术手段在各自方案中的实际作用；作用相同即使目的表述不同仍可能构成启示"
  - rule: "不要把’没有预料不到的技术效果’当作不具备创造性的理由，也不要把预料不到的技术效果当作必须具备的条件"
