profile: headless
composition: patent-jobs
recording: live
header:
  class: patent-jobs
input:
  task: |
    这是一件无效宣告请求的分析作业，只做下面两步，不使用 shell，不读写工作区里的其它文件。

    第 1 步：调用 patent_workflow_run，参数 manifestId 传 patent_invalidation_v1，input 传下面这段无效宣告请求书要点，claims 传下面这段权利要求书，chartTargets 传下面这个 JSON 数组的字符串形式（即把整段数组当字符串传，不要传成对象或数组），三处都必须逐字原样传入（不要改写、不要省略）：

    请求书要点：
    请求人请求宣告第 ZL201810123456.7 号发明专利的权利要求 1-3 全部无效。请求人认为：权利要求 1 相对于证据 1（CN101234567A，阀体伴热夹套结构）与证据 2（CN2345678B，螺旋形加热介质通道）的结合不具备创造性，不符合专利法第 22 条第 3 款的规定；权利要求 2 的附加技术特征已被证据 2 公开；权利要求 3 中的"适当间隙"含义不清楚，不符合专利法第 26 条第 4 款的规定；说明书对螺旋形加热介质通道的换热效果未充分公开，不符合专利法第 26 条第 3 款的规定。

    权利要求书：
    1. 一种阀体伴热夹套结构，其特征在于，包括阀体和设置在阀体外侧的伴热夹套，所述伴热夹套内设有螺旋形加热介质通道。
    2. 根据权利要求 1 所述的结构，其特征在于，所述伴热夹套的材质为不锈钢。
    3. 根据权利要求 1 所述的结构，其特征在于，所述伴热夹套与阀体之间设有适当间隙。

    chartTargets：
    [{"id":"D1","kind":"prior-art","title":"CN101234567A 阀体伴热夹套结构"},{"id":"D2","kind":"prior-art","title":"CN2345678B 螺旋形加热介质通道"}]

    该链运行到"人工确认分析结论"这一步会暂停等待人工确认，这是预期行为。

    第 2 步：如果第 1 步返回了审批门暂停，就再调用一次 patent_workflow_run，参数与第 1 步完全相同，另外传 approveStageIds=["approval"]，让整链跑到完成。

    最后用一句话说明两次调用的结果（第一次停在哪个阶段、第二次是否完成）。
