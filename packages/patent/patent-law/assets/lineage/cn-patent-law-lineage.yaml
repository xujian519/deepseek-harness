  - articleId: 47
    title: "无效宣告效力"
    currentStatus: active
    revisionHistory:
      - revision: "1984-original"
        effectiveDate: "1985-04-01"
        text: null
        changed: false
        source: "第六届全国人民代表大会常务委员会第四次会议通过"
      - revision: "1992-amendment"
        effectiveDate: "1993-01-01"
        text: null
        changed: false
        source: "第七届全国人民代表大会常务委员会第二十七次会议"
      - revision: "2000-amendment"
        effectiveDate: "2001-07-01"
        text: |
          宣告无效的专利权视为自始即不存在。
          宣告专利权无效的决定，对在宣告专利权无效前人民法院作出并已执行的专利侵权的判决、裁定，已经履行或者强制执行的专利侵权纠纷处理决定，以及已经履行的专利实施许可合同和专利权转让合同，不具有追溯力。但是因专利权人的恶意给他人造成的损失，应当给予赔偿。
          如果依照前款规定，专利权人或者专利权转让人不向被许可实施专利人或者专利权受让人返还专利使用费或者专利权转让费，明显违反公平原则，专利权人或者专利权转让人应当向被许可实施专利人或者专利权受让人返还全部或者部分专利使用费或者专利权转让费。
        changed: true
        source: "第九届全国人民代表大会常务委员会第十七次会议"
      - revision: "2008-amendment"
        effectiveDate: "2009-10-01"
        text: null
