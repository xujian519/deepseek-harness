# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.
#
# The composition's own record patch is applied after this profile's replay
# variant, so every row it changes has to be restated here.

- id: llm-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              # Capability parity with the live adapter so replay
              # reconstructs the freshly recorded request context.
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: patent-tools
      name: '@deepseek-ai/dsh-patent-tools'

    - id: patent-deadline
      name: '@deepseek-ai/dsh-patent-deadline'

    - id: patent-document
      name: '@deepseek-ai/dsh-patent-document'

    - id: patent-rule
      name: '@deepseek-ai/dsh-patent-rule'
      config:
        # 与 shipped `patent` preset 同形的门禁声明（preset 是 agent 平面，headless
        # 组合不挂 preset，故在此按同一声明组装，门禁行为才能被录制与回放）：
        # 交付前置门禁 + 制品结构门禁。
        deliveryGate:
          - tool: render_patent_document
            requires: [rule_check, law_verify, matter_log_append]
          - tool: build_patent_filing
            requires: [rule_check, law_verify, matter_log_append]
          - tool: render_patent_document
            requires: [patent_workflow_run]
            whenArgs:
              template:
                - patentability-opinion
                - search-report
                - search-report-form
                - oa-response
                - invalidation-opinion
                - re-examination-request
                - infringement-opinion
                - litigation-pleading
                - claims-spec
        structuralGate:
          - tool: render_patent_document
            whenArgs:
              template: oa-response
            ruleIds:
              - PR-OA-007
            textArgs:
              - draft
