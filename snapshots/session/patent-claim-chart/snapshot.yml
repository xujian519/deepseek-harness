input:
  task: |
    这是一件侵权比对的要素级对照表作业，只做下面这一步，不调用其它工具，不使用 shell，不读写工作区里的其它文件。

    调用 claim_chart_build，参数为 mode 传 "infringement"，claim_text 传下面这段权利要求书，targets 传下面这个 JSON 数组，risk 传下面这个 JSON 对象，三处都必须逐字原样传入（不要改写、不要省略）。targets 与 risk 都按 JSON 本身传，不要传成字符串。

    权利要求书：

    1. 一种阀体伴热夹套结构，其特征在于，包括阀体和设置在阀体外侧的伴热夹套，所述伴热夹套内设有螺旋形加热介质通道。
    2. 根据权利要求 1 所述的结构，其特征在于，所述伴热夹套的材质为不锈钢。
    3. 根据权利要求 1 所述的结构，其特征在于，所述伴热夹套与阀体之间设有适当间隙。

    targets：

    [{"id":"P1","kind":"accused-product","title":"被控产品：阀体伴热夹套（螺旋盘管，碳钢夹套，导热硅脂填充）"}]

    risk：

    {"defenses":["low"],"remedyExposureRatio":0.3,"estoppelApplied":false,"dedicationApplied":false}

    最后用一句话说明结果：拆出的要素数与行数、gap 数，以及确定性结论段给出的覆盖判定与风险等级（未给出风险等级时照实说明原因）。
