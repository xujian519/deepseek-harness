# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

# The /synapse canvas host half registers HTTP routes, so it cannot activate
# without the disabled webserver; its client assets are served by those same
# routes and are equally unreachable.
- id: synapse
  disabled: true

- id: synapse-client
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

# The desktop-shell provider occupies ctx.desktop: it calls the Electron main
# process over the bridge socket (DSH_DESKTOP_BRIDGE_PATH) for dialogs,
# notifications, menu items, global shortcuts, and tray customization, and it
# degrades to warn-only when the variable is absent (headless development).
- insert:
    - id: desktop-shell
      name: '@deepseek-ai/dsh-desktop-shell'

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
